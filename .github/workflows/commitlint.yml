name: Commit Lint

on:
  pull_request:
    branches: [development, master]
    types: [opened, edited, synchronize, reopened]

jobs:
  commitlint:
    name: Validate PR title & commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Valida el TÍTULO del PR (debe seguir Conventional Commits)
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            refactor
            docs
            test
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            El título del PR debe empezar en minúscula.
            Ejemplo correcto: "feat: add team creation endpoint"

      # Valida que TODOS los commits del PR sigan el formato
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all commits in PR
        run: |
          pnpm -w exec commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  no-direct-push-to-main:
    name: Block direct push to main
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Fail on direct push
        run: |
          echo "❌ Push directo a master no permitido."
          echo "Abre un PR desde development → master."
          exit 1

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: api_logs
    static_configs:
      - targets: [localhost]
        labels:
          service: api
          __path__: /logs/api/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            type: type
      # pino serializes levels as numbers when transport.targets is used (Pino limitation).
      # Map numeric values to strings so Loki labels stay queryable.
      - template:
          source: level
          template: >-
            {{ if eq .Value "10" }}trace
            {{ else if eq .Value "20" }}debug
            {{ else if eq .Value "30" }}info
            {{ else if eq .Value "40" }}warn
            {{ else if eq .Value "50" }}error
            {{ else if eq .Value "60" }}fatal
            {{ else }}{{ .Value }}
            {{ end }}
      - labels:
          level:
          type:

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: api_logs
    static_configs:
      - targets: [localhost]
        labels:
          service: api
          __path__: /logs/api/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            type: type
      - labels:
          level:
          type:
